services:
  # --- INFRASTRUCTURE ---
  
  postgres:
    image: postgres:15-alpine
    container_name: fisher_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fisher_net

  redis:
    image: redis:7-alpine
    container_name: fisher_redis
    restart: always
    ports:
      - "6379:6379" 
    volumes:
      - redis_data:/data
    networks:
      - fisher_net

  # --- MICROSERVICES ---

  game_engine:
    build: ./services/game_engine
    container_name: fisher_engine
    restart: always
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: 1
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      BOT_API_KEY: ${BOT_API_KEY}
      DISCORD_BOT_API_KEY: ${DISCORD_BOT_API_KEY}
      TWITCH_BOT_SERVICE_KEY: ${TWITCH_BOT_SERVICE_KEY:-}
      TESTING_API_ENABLED: ${TESTING_API_ENABLED:-false}
      TESTING_API_KEY: ${TWITCH_E2E_ENGINE_API_KEY:-}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      TWITCH_CLIENT_ID: ${API_TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${API_TWITCH_CLIENT_SECRET}
      STREAM_ELEMENTS_ECONOMY_ENABLED: ${STREAM_ELEMENTS_ECONOMY_ENABLED:-true}
      STREAMELEMENTS_API_BASE_URL: ${STREAMELEMENTS_API_BASE_URL:-https://api.streamelements.com}
      TWITCH_DISCORD_REDIRECT_URI: ${TWITCH_DISCORD_REDIRECT_URI:-http://localhost:8000/v1/auth/twitch/discord/callback}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:-}
      INTEGRATIONS_ENCRYPTION_KEYS: ${INTEGRATIONS_ENCRYPTION_KEYS:-}
      INTEGRATIONS_ENCRYPTION_KEY_VERSION: ${INTEGRATIONS_ENCRYPTION_KEY_VERSION:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      RUN_BACKGROUND_WORKERS: "false"
    depends_on:
      - postgres
      - redis
    networks:
      - fisher_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  game_worker:
    build: ./services/game_engine
    container_name: fisher_worker
    restart: always
    command: python worker_main.py
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:-}
      INTEGRATIONS_ENCRYPTION_KEYS: ${INTEGRATIONS_ENCRYPTION_KEYS:-}
      INTEGRATIONS_ENCRYPTION_KEY_VERSION: ${INTEGRATIONS_ENCRYPTION_KEY_VERSION:-1}
      STREAM_ELEMENTS_ECONOMY_ENABLED: ${STREAM_ELEMENTS_ECONOMY_ENABLED:-true}
      STREAMELEMENTS_API_BASE_URL: ${STREAMELEMENTS_API_BASE_URL:-https://api.streamelements.com}
      BOT_API_KEY: ${BOT_API_KEY}
      DISCORD_BOT_API_KEY: ${DISCORD_BOT_API_KEY}
      TWITCH_BOT_SERVICE_KEY: ${TWITCH_BOT_SERVICE_KEY:-}
      TESTING_API_ENABLED: ${TESTING_API_ENABLED:-false}
      TESTING_API_KEY: ${TWITCH_E2E_ENGINE_API_KEY:-}
      TWITCH_CLIENT_ID: ${API_TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${API_TWITCH_CLIENT_SECRET}
    depends_on:
      - game_engine
    networks:
      - fisher_net

  discord_gateway:
    build: ./services/discord_gateway
    container_name: fisher_discord
    restart: always
    environment:
      PYTHONUNBUFFERED: 1
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_BOT_API_KEY: ${DISCORD_BOT_API_KEY}
      ENGINE_URL: http://game_engine:8000
      REDIS_URL: redis://redis:6379/0
      COMMAND_SYNC_MODE: ${COMMAND_SYNC_MODE:-global}
      DEV_GUILD_ID: ${DEV_GUILD_ID:-}
    expose:
      - "8081"
    depends_on:
      game_engine:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - fisher_net

  bot_gateway:
    build: ./services/bot_gateway
    container_name: fisher_bot
    restart: always
    command: python main.py
    volumes:
      - ./services/bot_gateway:/app
    environment:
      PYTHONUNBUFFERED: 1
      TWITCH_TOKEN: ${TWITCH_TOKEN}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      BOT_NICK: ${BOT_NICK}
      BOT_API_KEY: ${BOT_API_KEY}
      TWITCH_BOT_SERVICE_KEY: ${TWITCH_BOT_SERVICE_KEY:-}
      TWITCH_CHANNEL_SOURCE: ${TWITCH_CHANNEL_SOURCE:-database}
      TWITCH_CHANNEL_RECONCILE_SECONDS: ${TWITCH_CHANNEL_RECONCILE_SECONDS:-10}
      BOOTSTRAP_CHANNELS: ${BOOTSTRAP_CHANNELS:-}
      BOT_INSTANCE_ID: ${BOT_INSTANCE_ID:-bot-gateway-1}
      ENGINE_URL: http://game_engine:8000 
    depends_on:
      - game_engine
    networks:
      - fisher_net

  streamelements_stub:
    build: ./services/streamelements_stub
    container_name: fisher_streamelements_stub
    restart: "no"
    profiles: ["e2e"]
    environment:
      PYTHONUNBUFFERED: 1
      STREAMELEMENTS_STUB_CONTROL_KEY: ${STREAMELEMENTS_STUB_CONTROL_KEY:-}
    expose:
      - "8080"
    networks:
      - fisher_net

  twitch_e2e_runner:
    build: ./services/twitch_e2e_runner
    container_name: fisher_twitch_e2e_runner
    restart: "no"
    profiles: ["e2e"]
    environment:
      PYTHONUNBUFFERED: 1
      TWITCH_E2E_ENABLED: ${TWITCH_E2E_ENABLED:-false}
      TWITCH_E2E_MODE: ${TWITCH_E2E_MODE:-stub}
      TWITCH_E2E_TRANSPORT: ${TWITCH_E2E_TRANSPORT:-disabled}
      TWITCH_E2E_CHANNEL: ${TWITCH_E2E_CHANNEL:-}
      TWITCH_E2E_CHANNEL_ID: ${TWITCH_E2E_CHANNEL_ID:-}
      TWITCH_E2E_PROVIDER_CHANNEL_ID: ${TWITCH_E2E_PROVIDER_CHANNEL_ID:-}
      TWITCH_E2E_BOT_LOGIN: ${TWITCH_E2E_BOT_LOGIN:-}
      TWITCH_E2E_BOT_USER_ID: ${TWITCH_E2E_BOT_USER_ID:-}
      TWITCH_E2E_CLIENT_ID: ${TWITCH_E2E_CLIENT_ID:-}
      TWITCH_E2E_CLIENT_SECRET: ${TWITCH_E2E_CLIENT_SECRET:-}
      TWITCH_E2E_ENGINE_URL: http://game_engine:8000
      TWITCH_E2E_ENGINE_API_KEY: ${TWITCH_E2E_ENGINE_API_KEY:-}
      TWITCH_E2E_STUB_URL: http://streamelements_stub:8080
      TWITCH_E2E_STUB_CONTROL_KEY: ${STREAMELEMENTS_STUB_CONTROL_KEY:-}
      TWITCH_E2E_RUNNER_API_KEY: ${TWITCH_E2E_RUNNER_API_KEY:-}
      TWITCH_E2E_RESULT_DB: /tmp/twitch_e2e_runs.sqlite3
      TWITCH_E2E_COMMAND_TIMEOUT: ${TWITCH_E2E_COMMAND_TIMEOUT:-45}
      TWITCH_E2E_ACTOR_START_TIMEOUT: ${TWITCH_E2E_ACTOR_START_TIMEOUT:-90}
      TWITCH_E2E_SEND_INTERVAL: ${TWITCH_E2E_SEND_INTERVAL:-1.6}
      TWITCH_E2E_IRC_RETRY_LIMIT: ${TWITCH_E2E_IRC_RETRY_LIMIT:-3}
      TWITCH_E2E_MAX_CONCURRENCY: ${TWITCH_E2E_MAX_CONCURRENCY:-8}
      TWITCH_E2E_OWNER_USER_ID: ${TWITCH_E2E_OWNER_USER_ID:-}
      TWITCH_E2E_OWNER_LOGIN: ${TWITCH_E2E_OWNER_LOGIN:-}
      TWITCH_E2E_OWNER_ACCESS_TOKEN: ${TWITCH_E2E_OWNER_ACCESS_TOKEN:-}
      TWITCH_E2E_OWNER_REFRESH_TOKEN: ${TWITCH_E2E_OWNER_REFRESH_TOKEN:-}
      TWITCH_E2E_EDITOR_USER_ID: ${TWITCH_E2E_EDITOR_USER_ID:-}
      TWITCH_E2E_EDITOR_LOGIN: ${TWITCH_E2E_EDITOR_LOGIN:-}
      TWITCH_E2E_EDITOR_ACCESS_TOKEN: ${TWITCH_E2E_EDITOR_ACCESS_TOKEN:-}
      TWITCH_E2E_EDITOR_REFRESH_TOKEN: ${TWITCH_E2E_EDITOR_REFRESH_TOKEN:-}
      TWITCH_E2E_VIEWER1_USER_ID: ${TWITCH_E2E_VIEWER1_USER_ID:-}
      TWITCH_E2E_VIEWER1_LOGIN: ${TWITCH_E2E_VIEWER1_LOGIN:-}
      TWITCH_E2E_VIEWER1_ACCESS_TOKEN: ${TWITCH_E2E_VIEWER1_ACCESS_TOKEN:-}
      TWITCH_E2E_VIEWER1_REFRESH_TOKEN: ${TWITCH_E2E_VIEWER1_REFRESH_TOKEN:-}
      TWITCH_E2E_VIEWER2_USER_ID: ${TWITCH_E2E_VIEWER2_USER_ID:-}
      TWITCH_E2E_VIEWER2_LOGIN: ${TWITCH_E2E_VIEWER2_LOGIN:-}
      TWITCH_E2E_VIEWER2_ACCESS_TOKEN: ${TWITCH_E2E_VIEWER2_ACCESS_TOKEN:-}
      TWITCH_E2E_VIEWER2_REFRESH_TOKEN: ${TWITCH_E2E_VIEWER2_REFRESH_TOKEN:-}
    ports:
      - "8090:8090"
    depends_on:
      game_engine:
        condition: service_healthy
      streamelements_stub:
        condition: service_started
    networks:
      - fisher_net
  
  frontend:
    build: ./services/frontend
    container_name: fisher_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - game_engine
    networks:
      - fisher_net

networks:
  fisher_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
