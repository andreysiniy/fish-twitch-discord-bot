name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fisher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fisher_test
      REDIS_URL: redis://localhost:6379/15
      SECRET_KEY: test-secret-key-that-is-long-enough
      BOT_API_KEY: test-bot-api-key
      TWITCH_CLIENT_ID: test-client-id
      TWITCH_CLIENT_SECRET: test-client-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check --select E9,F63,F7,F82 services/game_engine services/bot_gateway tests
      - run: alembic -c services/game_engine/alembic.ini upgrade head
        env:
          PYTHONPATH: services/game_engine
      - run: pytest -q
      - run: docker build services/game_engine
      - run: docker build services/bot_gateway

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
